spring:
  application:
    name: sot-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sot}
    username: ${DATABASE_USERNAME:sot}
    password: ${DATABASE_PASSWORD:sot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful
