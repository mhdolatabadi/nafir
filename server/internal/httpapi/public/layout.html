{{define "layout"}}<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
{{if .NoIndex}}<meta name="robots" content="noindex">{{else}}<link rel="canonical" href="{{.Canonical}}">{{end}}
<meta name="theme-color" content="#070810">
<link rel="icon" type="image/png" href="/nafir.png">
<meta property="og:site_name" content="نفیر">
<meta property="og:locale" content="fa_IR">
<meta property="og:type" content="{{.OGType}}">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:image" content="{{.Image}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{.Image}}">
{{if .JSONLD}}<script type="application/ld+json">{{.JSONLD}}</script>{{end}}
<style>
:root{--bg:#070810;--surface:#121522;--strong:#191d2d;--text:#f3f4f8;--muted:#b4b8c7;--primary:#ff626a;--border:#ffffff26}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:12px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.site{position:sticky;top:0;z-index:1;background:#070810f2;border-bottom:1px solid var(--border)}
header.site .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:20px}
.brand svg{width:36px;height:36px}
.spacer{flex:1}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid var(--border)}
.button.primary{background:var(--primary);color:#1a0306;border-color:transparent}
.hero{padding:40px 0 16px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,40px);line-height:1.3}
.hero p{margin:0;color:var(--muted)}
.meta{color:var(--muted);font-size:14px}
.list{list-style:none;margin:16px 0 120px;padding:0}
.list li{border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:14px;min-height:72px;padding:10px 4px;text-decoration:none}
.art{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--strong);color:var(--muted);font-size:22px}
.grow{flex:1;min-width:0}
.title{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.likes{flex:none;color:var(--muted);font-size:14px}
audio{width:100%;max-width:260px;height:40px}
.track{flex-wrap:wrap}
.track audio{flex-basis:100%;max-width:none}
@media (min-width:600px){.track{flex-wrap:nowrap}.track audio{flex-basis:auto;max-width:260px}}
.empty{padding:48px 0;color:var(--muted);text-align:center}
footer{padding:24px 0 40px;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<header class="site"><div class="wrap">
<a class="brand" href="/" aria-label="نفیر، صفحه‌ی اول">{{template "icon"}}<span>نفیر</span></a>
<span class="spacer"></span>
<a class="button primary" href="/app/">ورود / ثبت‌نام</a>
</div></header>
<main class="wrap">{{template "content" .}}</main>
<footer class="wrap">نفیر — پخش‌کننده‌ی موسیقی ابری</footer>
</body>
</html>{{end}}

{{define "icon"}}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#000000"/><g transform="rotate(-35 256 256) translate(256 256) scale(0.9) translate(-256 -256)"><path fill="#E53935" d="M52 238C64 240 72 247 78 249L330 244C382 242 424 222 452 186L452 326C424 290 382 270 330 268L78 263C72 265 64 272 52 274Z"/><rect x="150" y="245" width="9" height="22" fill="#000000"/><rect x="238" y="244" width="9" height="24" fill="#000000"/><ellipse cx="452" cy="256" rx="9" ry="70" fill="#9E1C1A"/></g></svg>{{end}}
