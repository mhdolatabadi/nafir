# The old domain after the move to rhythmo.ir (#180). Include this inside
# the server { } block of the old domain, after its TLS settings:
#
#     include /etc/nginx/snippets/rhythmo-legacy.conf;
#
# Installed Android apps keep calling the address they were built with
# until they update, so the API stays reachable here: redirecting it would
# break uploads and other POST requests. Audio needs no route here, because
# presigned links always point at NAFIR_DOMAIN. Everything else, the web
# app and the public pages, moves permanently to the new domain.

resolver 127.0.0.11 valid=30s ipv6=off;

location /api/ {
    set $nafir_api nafir-api:8080;
    proxy_pass http://$nafir_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Nafir-Client-IP $remote_addr;
    proxy_read_timeout 60s;
}

location / {
    return 301 https://rhythmo.ir$request_uri;
}
