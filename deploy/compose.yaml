services:
  api:
    image: ${NAFIR_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/api:${NAFIR_IMAGE_TAG:-latest}
    build:
      context: ../server
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${NAFIR_DOMAIN}
      DATABASE_URL: postgres://nafir:${POSTGRES_PASSWORD}@postgres:5432/nafir?sslmode=disable
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_PUBLIC_URL: https://${NAFIR_DOMAIN}
      STORAGE_BUCKET: nafir-music
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-5368709120}
      MAX_PENDING_UPLOADS: ${MAX_PENDING_UPLOADS:-3}
      PENDING_UPLOAD_TTL: ${PENDING_UPLOAD_TTL:-2h}
      PENDING_CLEANUP_INTERVAL: ${PENDING_CLEANUP_INTERVAL:-10m}
      PENDING_CLEANUP_BATCH: ${PENDING_CLEANUP_BATCH:-100}
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-true}
      REGISTER_RATE_REQUESTS: ${REGISTER_RATE_REQUESTS:-5}
      REGISTER_RATE_WINDOW: ${REGISTER_RATE_WINDOW:-1h}
      LOGIN_RATE_REQUESTS: ${LOGIN_RATE_REQUESTS:-30}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      UPLOAD_RESERVATION_USER_RATE_REQUESTS: ${UPLOAD_RESERVATION_USER_RATE_REQUESTS:-120}
      UPLOAD_RESERVATION_USER_RATE_WINDOW: ${UPLOAD_RESERVATION_USER_RATE_WINDOW:-10m}
      UPLOAD_RESERVATION_IP_RATE_REQUESTS: ${UPLOAD_RESERVATION_IP_RATE_REQUESTS:-240}
      UPLOAD_RESERVATION_IP_RATE_WINDOW: ${UPLOAD_RESERVATION_IP_RATE_WINDOW:-10m}
      UPLOAD_COMPLETION_USER_RATE_REQUESTS: ${UPLOAD_COMPLETION_USER_RATE_REQUESTS:-240}
      UPLOAD_COMPLETION_USER_RATE_WINDOW: ${UPLOAD_COMPLETION_USER_RATE_WINDOW:-10m}
      UPLOAD_COMPLETION_IP_RATE_REQUESTS: ${UPLOAD_COMPLETION_IP_RATE_REQUESTS:-480}
      UPLOAD_COMPLETION_IP_RATE_WINDOW: ${UPLOAD_COMPLETION_IP_RATE_WINDOW:-10m}
      # Each messenger bot stays off until its token is set; see README.md.
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_BOT_USERNAME: ${BALE_BOT_USERNAME:-}
      BALE_API_URL: ${BALE_API_URL:-https://tapi.bale.ai}
      BALE_MAX_DOWNLOAD_BYTES: ${BALE_MAX_DOWNLOAD_BYTES:-20971520}
      BALE_PROXY_URL: ${BALE_PROXY_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_MAX_DOWNLOAD_BYTES: ${TELEGRAM_MAX_DOWNLOAD_BYTES:-20971520}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      BOT_PUBLIC_URL: https://${NAFIR_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal, edge]

  web:
    image: ${NAFIR_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/web:${NAFIR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    networks: [edge]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nafir
      POSTGRES_USER: nafir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nafir -d nafir"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # On edge only so Caddy can forward presigned bucket requests; no ports are published.
    networks: [internal, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NAFIR_DOMAIN: ${NAFIR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
