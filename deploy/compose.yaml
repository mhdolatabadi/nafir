services:
  api:
    image: ${SOT_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/api:${SOT_IMAGE_TAG:-latest}
    build:
      context: ../server
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${SOT_DOMAIN}
      DATABASE_URL: postgres://sot:${POSTGRES_PASSWORD}@postgres:5432/sot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  web:
    image: ${SOT_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/web:${SOT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    networks: [edge]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sot
      POSTGRES_USER: sot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sot -d sot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SOT_DOMAIN: ${SOT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
