# Nafir's routes for a shared front nginx that reaches the stack over the
# external proxynet network (#153). Include this file inside the server { }
# block that serves the Nafir domain, after its TLS settings:
#
#     include /etc/nginx/snippets/nafir.conf;
#
# It mirrors deploy/Caddyfile; change both together. Upstreams are looked up
# through Docker's DNS when requests arrive, so nginx still starts while a
# Nafir container is being recreated.

resolver 127.0.0.11 valid=30s ipv6=off;

# Uploads go straight to storage through /nafir-music; the API enforces the
# real size and quota limits (MAX_UPLOAD_BYTES, 200 MiB by default).
client_max_body_size 210m;

# The API: JSON endpoints.
location /api/ {
    set $nafir_api nafir-api:8080;
    proxy_pass http://$nafir_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Feeds the per-visitor rate limits.
    proxy_set_header X-Nafir-Client-IP $remote_addr;
    proxy_read_timeout 60s;
}

# Presigned audio URLs. The signature covers the Host header, so it must
# pass unchanged. Media stays byte-for-byte: no compression, no buffering,
# Range requests pass through for seeking.
location /nafir-music {
    set $nafir_minio nafir-minio:9000;
    proxy_pass http://$nafir_minio;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    gzip off;
    add_header Cache-Control "private, no-transform" always;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Store and support pages must stay outside the Flutter app.
location = /privacy {
    set $nafir_api nafir-api:8080;
    proxy_pass http://$nafir_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Nafir-Client-IP $remote_addr;
}
location = /delete-account {
    set $nafir_api nafir-api:8080;
    proxy_pass http://$nafir_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Nafir-Client-IP $remote_addr;
}

# The Flutter web app.
location = /app {
    return 308 /app/;
}
location /app/ {
    set $nafir_web nafir-web:80;
    proxy_pass http://$nafir_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else is the public site the API renders: the front page,
# /p/{token} playlist pages, /privacy, /delete-account, sitemap.xml and
# robots.txt. Share links from before the app moved to /app keep working.
location = / {
    if ($arg_shared) {
        return 302 /app/?$args;
    }
    if ($arg_collab) {
        return 302 /app/?$args;
    }
    set $nafir_api nafir-api:8080;
    proxy_pass http://$nafir_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Nafir-Client-IP $remote_addr;
}
location / {
    set $nafir_api nafir-api:8080;
    proxy_pass http://$nafir_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Nafir-Client-IP $remote_addr;
}
