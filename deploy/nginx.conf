server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is built with --base-href /app/ and lives under /app/.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /app/flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
}
