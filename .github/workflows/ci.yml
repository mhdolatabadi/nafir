name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        shell: bash
        run: |
          if ! dart format --set-exit-if-changed .; then
            git diff -- .
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --base-href /app/ --dart-define=API_BASE_URL=https://music.example.com
      - name: Build Android debug APK
        # The APK is meant to be installed, so it talks to the real server.
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.NAFIR_API_BASE_URL || 'https://rhythmo.ir' }}
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nafir-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-boot:
    # Proves the Android app starts with its real plugins on an emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Boot test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # 10.0.2.2 is the host from inside the emulator; nothing listens on port 9.
          script: flutter test integration_test --dart-define=API_BASE_URL=http://10.0.2.2:9

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nafir_test
          POSTGRES_USER: nafir
          POSTGRES_PASSWORD: nafir
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nafir -d nafir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nafir:nafir@localhost:5432/nafir_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e NAFIR_DOMAIN=music.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Assert media bypasses response encoding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("deploy/Caddyfile").read_text()
          matcher = "@musicStorage path /nafir-music /nafir-music/*"
          assert matcher in config
          media = config.split("handle @musicStorage {", 1)[1].split("}", 1)[0]
          assert "no-transform" in media
          assert "encode " not in media
          assert "reverse_proxy minio:9000" in media

          # Store/legal pages stay outside /app and are rendered by the API.
          public_legal = config.split("handle @publicLegal {", 1)[1].split("}", 1)[0]
          assert "@publicLegal path /privacy /delete-account" in config
          assert "reverse_proxy api:8080" in public_legal
          assert "reverse_proxy web:80" not in public_legal
          # The app lives under /app/; old share and collab links redirect there.
          assert "handle /app/* {" in config
          assert "@legacyShare" in config and "@legacyCollab" in config
          assert "query shared=*" in config and "query collab=*" in config
          assert "redir * /app/?{query} 302" in config
          # The public pages (and their rate limits) need the client IP.
          fallback = config.rsplit("handle {", 1)[1]
          assert "reverse_proxy api:8080" in fallback
          assert "X-Nafir-Client-IP" in fallback

          docker = Path("deploy/Dockerfile.web").read_text()
          assert "--base-href /app/" in docker
          assert "/usr/share/nginx/html/app" in docker
          # A fixed project name, with the data volumes it inherited.
          compose = Path("deploy/compose.yaml").read_text()
          assert compose.startswith("#") and "\nname: nafir\n" in compose
          for volume in ("postgres-data", "minio-data", "caddy-data", "caddy-config"):
              assert f"name: deploy_{volume}" in compose, volume

          nginx = Path("deploy/nginx.conf").read_text()
          assert "location /app/" in nginx and "/app/index.html" in nginx
          # Nothing outside /app/ may fall through to nginx's stock page (#153).
          assert "return 302 /app/$is_args$args;" in nginx
          assert "rm -f /usr/share/nginx/html/index.html" in docker

          # The shared front nginx routes like the Caddyfile (#153).
          front = Path("deploy/front-proxy.nginx.conf").read_text()
          for route in ("location /api/", "location /nafir-music", "location /app/", "location / {"):
              assert route in front, route
          for route in ("location = /privacy", "location = /delete-account"):
              block = front.split(route, 1)[1].split("}", 1)[0]
              assert "nafir-api:8080" in block
              assert "nafir-web:80" not in block
          assert "nafir-web:80" in front.split("location /app/", 1)[1].split("}", 1)[0]
          assert "$arg_collab" in front and "$arg_shared" in front
          assert "nafir-api:8080" in front.rsplit("location / {", 1)[1]
          assert "X-Nafir-Client-IP" in front.rsplit("location / {", 1)[1]
          assert "gzip off" in front.split("location /nafir-music", 1)[1].split("}", 1)[0]
          PY
      - name: Validate nginx configurations
        run: |
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
          printf 'server {\n listen 80;\n include /etc/nginx/nafir.conf;\n}\n' > front-test.conf
          docker run --rm \
            -v "$PWD/front-test.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/front-proxy.nginx.conf:/etc/nginx/nafir.conf:ro" \
            nginx:1.27-alpine nginx -t
          printf 'server {\n listen 80;\n include /etc/nginx/legacy.conf;\n}\n' > legacy-test.conf
          docker run --rm \
            -v "$PWD/legacy-test.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/legacy-domain.nginx.conf:/etc/nginx/legacy.conf:ro" \
            nginx:1.27-alpine nginx -t
