name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=https://music.example.com
      - name: Generate Android project
        run: flutter create --platforms=android --org com.mhdolatabadi --project-name nafir .
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://music.example.com
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nafir-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nafir_test
          POSTGRES_USER: nafir
          POSTGRES_PASSWORD: nafir
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nafir -d nafir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nafir:nafir@localhost:5432/nafir_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
