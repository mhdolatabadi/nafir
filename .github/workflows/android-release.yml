name: Android release

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      cafebazaar:
        description: Also submit this release to Cafe Bazaar for review
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Cafe Bazaar gets a release when one is asked for by hand, or after
      # every release when the CAFEBAZAAR_PUBLISH_EVERY_RELEASE variable is
      # true; never without its API secret (#95).
      CAFEBAZAAR_PUBLISH: >-
        ${{ secrets.CAFEBAZAAR_API_SECRET != '' &&
        (inputs.cafebazaar || vars.CAFEBAZAAR_PUBLISH_EVERY_RELEASE == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Prepare automatic version
        id: version
        shell: bash
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Configure Android release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" && -n "${ANDROID_STORE_PASSWORD}" ]]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.jks
            {
              printf 'storePassword=%s\n' "${ANDROID_STORE_PASSWORD}"
              printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
              printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
              printf 'storeFile=release.jks\n'
            } > android/key.properties
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "label=production-signed" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Android release signing secrets are missing; building test-signed packages with the debug key and skipping GitHub Release publication."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "label=test-signed" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Android packages
        shell: bash
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE_URL=${{ vars.NAFIR_API_BASE_URL || 'https://rhythmo.ir' }}
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE_URL=${{ vars.NAFIR_API_BASE_URL || 'https://rhythmo.ir' }}
          mv build/app/outputs/flutter-apk/app-release.apk \
            "nafir-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.apk"
          mv build/app/outputs/bundle/release/app-release.aab \
            "nafir-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.aab"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: nafir-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}
          path: |
            nafir-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.apk
            nafir-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Nafir ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            nafir-${{ steps.version.outputs.tag }}-android-production-signed.apk
            nafir-${{ steps.version.outputs.tag }}-android-production-signed.aab

      - name: Submit to Cafe Bazaar
        if: steps.signing.outputs.configured == 'true' && env.CAFEBAZAAR_PUBLISH == 'true'
        env:
          CAFEBAZAAR_API_SECRET: ${{ secrets.CAFEBAZAAR_API_SECRET }}
          CAFEBAZAAR_AUTO_PUBLISH: ${{ vars.CAFEBAZAAR_AUTO_PUBLISH || 'false' }}
          CAFEBAZAAR_ROLLOUT_PERCENT: ${{ vars.CAFEBAZAAR_ROLLOUT_PERCENT || '100' }}
        run: >-
          scripts/publish-cafebazaar.sh
          "nafir-${{ steps.version.outputs.tag }}-android-production-signed.apk"
          "${{ steps.version.outputs.name }}"
